services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /mnt/ssd/nextcloud/config:/config
      - /mnt/ssd/nextcloud/data:/data
      - /mnt/ssd/media:/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost/status.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - minilab
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - "minilab.service=nextcloud"

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - TZ=Europe/Paris
      - DOMAIN=https://vaultwarden.${DUCKDNS_SUBDOMAIN}.duckdns.org
      - DATABASE_URL=mysql://vaultwarden:${VAULTWARDEN_DB_PASSWORD}@mariadb:3306/vaultwarden
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    volumes:
      - /mnt/ssd/vaultwarden/data:/data
    restart: unless-stopped
    networks:
      - minilab
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - "minilab.service=vaultwarden"

  pingvin-share:
    image: smp46/pingvin-share-x:latest
    container_name: pingvin-share
    command: ["sh", "/minilab/entrypoint.sh"]
    environment:
      - TZ=Europe/Paris
      - CONFIG_FILE=/tmp/config.yaml
    volumes:
      - /mnt/ssd/pingvin/data:/opt/app/backend/data
      - /mnt/ssd/pingvin/images:/opt/app/frontend/public/img
      - ./pingvin/entrypoint.sh:/minilab/entrypoint.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - minilab
    depends_on:
      cloudflared:
        condition: service_started
        restart: true
    labels:
      - "minilab.service=pingvin-share"
