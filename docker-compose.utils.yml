services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    environment:
      CONTAINERS: 1
      POST: 1
      EXEC: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - docker-proxy
    labels:
      - "minilab.service=docker-socket-proxy"

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: backup
    init: true
    environment:
      - TZ=Europe/Paris
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - /mnt/ssd:/mnt/ssd
    restart: unless-stopped
    networks:
      - minilab
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - "minilab.service=backup"