services:
  pingvin-share:
    image: smp46/pingvin-share-x:latest
    container_name: pingvin-share
    environment:
      - TZ=Europe/Paris
      - BACKEND_URL=https://${PINGVIN_HOSTNAME}
    volumes:
      - /mnt/ssd/pingvin/data:/opt/app/backend/data
      - /mnt/ssd/pingvin/images:/opt/app/frontend/public/img
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
    labels:
      - "minilab.service=pingvin-share"

  rollerderbyscoreboard:
    build:
      context: ./rollerderby-scoreboard
      dockerfile: Dockerfile
    container_name: rollerderbyscoreboard
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
    labels:
      - "minilab.service=rollerderbyscoreboard"

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Europe/Paris
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=mariadb:3306
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=${GITEA_HOSTNAME}
      - GITEA__server__SSH_DOMAIN=${GITEA_HOSTNAME}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__HTTP_PORT=3001
      - GITEA__server__ROOT_URL=http://${GITEA_HOSTNAME}:3001/
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__security__INSTALL_LOCK=true
    volumes:
      - /mnt/ssd/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    network_mode: "service:wireguard"
    depends_on:
      mariadb:
        condition: service_healthy
      wireguard:
        condition: service_healthy
    labels:
      - "minilab.service=gitea"
      
  minilab-helper:
    build:
      context: ./minilab-helper
      dockerfile: Dockerfile
    container_name: minilab-helper
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID}
      - WG_PEERS=${WG_PEERS}
      - TZ=Europe/Paris
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - /sys/class/thermal/thermal_zone0/temp:/sys/class/thermal/thermal_zone0/temp:ro
      - /proc/stat:/host/stat:ro
      - /proc/meminfo:/host/meminfo:ro
      - /:/host/rootfs:ro
      - /mnt/ssd:/host/ssd:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    network_mode: "service:wireguard"
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      wireguard:
        condition: service_healthy
    labels:
      - "minilab.service=minilab-helper"

  minilab-helper-v2:
    build:
      context: ./minilab-helper-v2
      dockerfile: Dockerfile
    container_name: minilab-helper-v2
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN_V2}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID_V2}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID}
      - WG_PEERS=${WG_PEERS}
      - TZ=Europe/Paris
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - /sys/class/thermal/thermal_zone0/temp:/sys/class/thermal/thermal_zone0/temp:ro
      - /proc/stat:/host/stat:ro
      - /proc/meminfo:/host/meminfo:ro
      - /:/host/rootfs:ro
      - /mnt/ssd:/host/ssd:ro
    restart: unless-stopped
    network_mode: "service:wireguard"
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      wireguard:
        condition: service_healthy
    labels:
      - "minilab.service=minilab-helper-v2"