services:
  rollerderbyscoreboard:
    build:
      context: ./rollerderby-scoreboard
      dockerfile: Dockerfile
    container_name: rollerderbyscoreboard
    profiles: [apps]
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - minilab
    labels:
      - "minilab.service=rollerderbyscoreboard"

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    profiles: [apps]
    user: 1000:1000
    environment:
      - TZ=Europe/Paris
    volumes:
      - /mnt/ssd/jellyfin/config:/config
      - /mnt/ssd/jellyfin/cache:/cache
      - /mnt/ssd/media:/media:ro
    restart: unless-stopped
    networks:
      - minilab
    labels:
      - "minilab.service=jellyfin"
