services:
  pingvin-share:
    image: smp46/pingvin-share-x:latest
    container_name: pingvin-share
    environment:
      - TZ=Europe/Paris
      - BACKEND_URL=https://${PINGVIN_HOSTNAME}
    volumes:
      - /mnt/ssd/pingvin/data:/opt/app/backend/data
      - /mnt/ssd/pingvin/images:/opt/app/frontend/public/img
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
    labels:
      - "minilab.service=pingvin-share"

  rollerderbyscoreboard:
    build:
      context: ./rollerderby-scoreboard
      dockerfile: Dockerfile
    container_name: rollerderbyscoreboard
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
    labels:
      - "minilab.service=rollerderbyscoreboard"

  minilab-helper-v2:
    build:
      context: ./minilab-helper-v2
      dockerfile: Dockerfile
    container_name: minilab-helper-v2
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN_V2}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID_V2}
      - DISCORD_OWNER_ID=${DISCORD_OWNER_ID}
      - WG_PEERS=${WG_PEERS}
      - TZ=Europe/Paris
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - /sys/class/thermal/thermal_zone0/temp:/sys/class/thermal/thermal_zone0/temp:ro
      - /proc/stat:/host/stat:ro
      - /proc/meminfo:/host/meminfo:ro
      - /:/host/rootfs:ro
      - /mnt/ssd:/host/ssd:ro
    restart: unless-stopped
    network_mode: "service:wireguard"
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      wireguard:
        condition: service_healthy
    labels:
      - "minilab.service=minilab-helper-v2"