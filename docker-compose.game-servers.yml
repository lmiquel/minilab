services:
  valheim:
    image: tsxcloud/valheim-arm:arm64
    container_name: valheim
    cap_add:
      - sys_nice
    environment:
      - SERVER_NAME=${VALHEIM_SERVER_NAME}
      - WORLD_NAME=${VALHEIM_WORLD_NAME}
      - SERVER_PASSWORD=${VALHEIM_PASSWORD}
      - SERVER_PUBLIC=0
      - UPDATE=enabled
      - SAVE_INTERVAL=1800
      - TZ=Europe/Paris
    volumes:
      - /mnt/ssd/valheim:/root/.config/unity3d/IronGate/Valheim
      - /mnt/ssd/valheim/backups:/data/backups
    ports:
      - "2456:2456/udp"
      - "2457:2457/udp"
      - "2458:2458/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/2456"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 240s
    networks:
      minilab:
        ipv4_address: 172.20.0.20
    labels:
      - "minilab.service=valheim"

  cobblemon:
    image: itzg/minecraft-server:java21
    container_name: cobblemon
    tty: true
    stdin_open: true
    environment:
      - UID=1000
      - GID=1000
      - EULA=TRUE
      - TZ=Europe/Paris
      - TYPE=FABRIC
      - MOD_PLATFORM=MODRINTH
      - MODRINTH_MODPACK=cobblemon-fabric
      - MODRINTH_LOADER=fabric
      - INIT_MEMORY=2G
      - MAX_MEMORY=5G
      - DIFFICULTY=normal
      - MOTD=${COBBLEMON_MOTD}
      - MAX_PLAYERS=3
      - PVP=FALSE
      - SERVER_NAME=${COBBLEMON_SERVER_NAME}
      - SPAWN_MONSTERS=false
    volumes:
      - /mnt/ssd/cobblemon:/data
    ports:
      - "25565:25565/tcp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/25565"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 240s
    networks:
      minilab:
        ipv4_address: 172.20.0.22
    labels:
      - "minilab.service=cobblemon"

  terraria:
    image: yon09/terraria-server:latest
    container_name: terraria
    environment:
      - TZ=Europe/Paris
      - WORLD_NAME=${TERRARIA_WORLD_NAME}
      - WORLD_SIZE=2
      - WORLD_DIFFICULTY=0
      - MOTD=${TERRARIA_MOTD}
      - LANGUAGE=en-US
      - MAX_PLAYERS=8
      - PASSWORD=${TERRARIA_PASSWORD}
    volumes:
      - /mnt/ssd/terraria:/opt/terraria-server/worlds
    ports:
      - "7777:7777/tcp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/7777"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      minilab:
        ipv4_address: 172.20.0.21
    labels:
      - "minilab.service=terraria"