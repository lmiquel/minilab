services:
  github-runner:
    image: myoung34/github-runner:ubuntu-noble
    container_name: github-runner
    profiles: [dev-tools]
    environment:
      - TZ=Europe/Paris
      - REPO_URL=${GITHUB_RUNNER_REPO_URL}
      - ACCESS_TOKEN=${GITHUB_RUNNER_ACCESS_TOKEN}
      - RUNNER_NAME=minilab-runner
      - RUNNER_SCOPE=repo
      - RUNNER_WORKDIR=/tmp/github-runner
      - LABELS=self-hosted,arm64,minilab
      - EPHEMERAL=false
      - DISABLE_AUTO_UPDATE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/ssd/github-runner/work:/tmp/github-runner
    restart: unless-stopped
    networks:
      minilab:
        ipv4_address: 172.20.0.32
    labels:
      - "minilab.service=github-runner"

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    profiles: [dev-tools]
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Europe/Paris
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=mariadb:3306
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=gitea.${DUCKDNS_SUBDOMAIN}.duckdns.org
      - GITEA__server__SSH_DOMAIN=${GITEA_SSH_HOSTNAME}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=https://gitea.${DUCKDNS_SUBDOMAIN}.duckdns.org/
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__security__INSTALL_LOCK=true
    volumes:
      - /mnt/ssd/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      minilab:
        ipv4_address: 172.20.0.43
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - "minilab.service=gitea"
